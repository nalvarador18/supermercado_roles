version: "3.9"

services:
  backend:
    build: ./backend
    container_name: supermercado_api
    ports:
      - "8000:8000"
    volumes:
      - supermercado_data:/data
    environment:
      - DB_PATH=/data/supermercado.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: supermercado_web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  supermercado_data:
    driver: local
